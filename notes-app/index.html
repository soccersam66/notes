<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notes">
<meta name="theme-color" content="#F4F4F6">
<title>Notes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6"/><path d="M9 13h4"/></svg></div>
      <b>Notes</b>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <div class="ind"></div>
      <button data-route="#/today">Today</button>
      <button data-route="#/classes">Classes</button>
    </nav>
    <div class="top-right">
      <div class="streak" id="streak" title="School days in a row"></div>
      <button class="icon card press" id="settingsBtn" aria-label="Settings"></button>
    </div>
  </header>
  <main id="view"></main>
</div>
<div id="editor" class="hide"></div>
<div class="toast" id="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
